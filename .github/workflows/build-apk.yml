name: Build APK

# Jalankan otomatis setiap push ke branch main, ATAU dipicu manual lewat
# tab "Actions" di GitHub (tombol "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java (dibutuhkan Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Setup Python (untuk skrip enkripsi data)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pycryptodome
        run: pip install pycryptodome

      - name: Generate folder platform Android (jika belum ada)
        # Project ini dikirim tanpa folder android/ karena folder tersebut
        # hanya bisa digenerate oleh Flutter SDK asli. CI ini membuatnya
        # otomatis SEKALI jika belum ada -- setelah itu, commit folder
        # android/ ke repo Anda supaya package name (applicationId) tidak
        # berubah acak setiap build (lihat catatan --org di panduan).
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.lflirboyo .
          fi

      - name: Naikkan compileSdk (plugin modern butuh minimal 34)
        # `flutter create` men-generate compileSdk lama (33) yang tidak lagi
        # cukup untuk dependency androidx terbaru yang dipakai plugin seperti
        # share_plus. Paksa ke 36 lewat sed, mendukung format Groovy
        # (build.gradle) MAUPUN Kotlin DSL (build.gradle.kts) tergantung versi
        # Flutter yang dipakai runner.
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 34/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
            sed -i 's/compileSdk flutter\.compileSdkVersion/compileSdk 36/' android/app/build.gradle
            sed -i 's/targetSdkVersion flutter\.targetSdkVersion/targetSdkVersion 34/' android/app/build.gradle
            sed -i 's/targetSdk flutter\.targetSdkVersion/targetSdk 34/' android/app/build.gradle
          fi
          echo "--- Isi bagian android{} setelah dipatch: ---"
          grep -A3 "compileSdk" android/app/build.gradle.kts 2>/dev/null || grep -A3 "compileSdk" android/app/build.gradle 2>/dev/null

      - name: Ambil dependency
        run: flutter pub get

      - name: Generate Hive TypeAdapter (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Enkripsi data_koordinat.json -> .enc
        run: python3 encrypt_data.py

      - name: Build APK (release)
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: pencari-kecamatan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
