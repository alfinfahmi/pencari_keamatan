      - name: Paksa compileSdk seragam di SEMUA modul (app + plugin pihak ketiga)
        run: |
          python3 << 'PYEOF'
          import pathlib
          import re

          # 1. Update compileSdk di android/app/build.gradle.kts (atau build.gradle)
          app_files = [
              pathlib.Path("android/app/build.gradle.kts"),
              pathlib.Path("android/app/build.gradle")
          ]
          
          for p in app_files:
              if not p.exists():
                  continue
              content = p.read_text()
              content, c1 = re.subn(r'compileSdk\s*=\s*\d+', 'compileSdk = 35', content)
              if c1 == 0:
                  content, c2 = re.subn(r'compileSdkVersion\s+\d+', 'compileSdkVersion 35', content)
              else:
                  c2 = 0
              
              if c1 > 0 or c2 > 0:
                  p.write_text(content)
                  print(f"Berhasil update compileSdk di aplikasi: {p}")
              elif "android {" in content:
                  content = content.replace("android {", "android {\n    compileSdk = 35")
                  p.write_text(content)
                  print(f"Berhasil menyisipkan compileSdk = 35 ke: {p}")

          # 2. Paksa subprojects / plugin pihak ketiga menggunakan plugins.withId di root build.gradle(.kts)
          KTS_BLOCK = '''
          // --- Ditambahkan otomatis oleh CI: paksa compileSdk seragam ke semua modul ---
          subprojects {
              plugins.withId("com.android.application") {
                  extensions.configure(com.android.build.gradle.BaseExtension::class.java) {
                      compileSdkVersion(35)
                  }
              }
              plugins.withId("com.android.library") {
                  extensions.configure(com.android.build.gradle.BaseExtension::class.java) {
                      compileSdkVersion(35)
                  }
              }
          }
          '''

          GROOVY_BLOCK = '''
          // --- Ditambahkan otomatis oleh CI: paksa compileSdk seragam ke semua modul ---
          subprojects {
              plugins.withId('com.android.application') {
                  android {
                      compileSdkVersion 35
                  }
              }
              plugins.withId('com.android.library') {
                  android {
                      compileSdkVersion 35
                  }
              }
          }
          '''

          root_candidates = [
              ("android/build.gradle.kts", KTS_BLOCK),
              ("android/build.gradle", GROOVY_BLOCK),
          ]

          MARKER = "Ditambahkan otomatis oleh CI"
          for path, block in root_candidates:
              p = pathlib.Path(path)
              if not p.exists():
                  continue
              text = p.read_text()
              if MARKER in text:
                  idx = text.find(MARKER)
                  line_start = text.rfind("\n// ---", 0, idx)
                  if line_start != -1:
                      text = text[:line_start].rstrip() + "\n"
              
              # Sisipkan di bagian atas file root build.gradle agar dievaluasi lebih awal
              text = block + "\n\n" + text
              p.write_text(text)
              print(f"Berhasil menambahkan subprojects override ke: {path}")

          PYEOF
