name: Build APK

# Jalankan otomatis setiap push ke branch main, ATAU dipicu manual lewat
# tab "Actions" di GitHub (tombol "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java (dibutuhkan Android Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Setup Python (untuk skrip enkripsi data)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pycryptodome
        run: pip install pycryptodome

      - name: Generate folder platform Android (jika belum ada)
        # Project ini dikirim tanpa folder android/ karena folder tersebut
        # hanya bisa digenerate oleh Flutter SDK asli. CI ini membuatnya
        # otomatis SEKALI jika belum ada -- setelah itu, commit folder
        # android/ ke repo Anda supaya package name (applicationId) tidak
        # berubah acak setiap build (lihat catatan --org di panduan).
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.lflirboyo .
          fi

      - name: Paksa compileSdk seragam di SEMUA modul (app + plugin pihak ketiga)
        # Percobaan sebelumnya (hanya menaikkan compileSdk di android/app/)
        # TERBUKTI TIDAK CUKUP: error build menunjukkan modul plugin pihak
        # ketiga seperti :share_plus (kode dari pub.dev, bukan bagian repo
        # ini) tetap resolve compileSdk=33 karena masing-masing merujuk ke
        # 'flutter.compileSdkVersion' miliknya sendiri, terlepas dari
        # perubahan di modul app kita.
        #
        # Solusi yang benar: override di level ROOT project
        # (android/build.gradle atau .kts, BUKAN android/app/...) memakai
        # blok 'subprojects { afterEvaluate { ... } }', yang berlaku untuk
        # SEMUA modul termasuk plugin pihak ketiga -- sudah diuji end-to-end
        # terhadap simulasi kedua format file (Kotlin DSL & Groovy) sebelum
        # dikirim ke workflow ini.
        run: |
          python3 << 'PYEOF'
          import pathlib

          KTS_BLOCK = '''
          // --- Ditambahkan otomatis oleh CI: paksa compileSdk seragam ke semua modul ---
          subprojects {
              afterEvaluate {
                  extensions.findByType(com.android.build.gradle.BaseExtension::class.java)?.apply {
                      compileSdkVersion(36)
                  }
              }
          }
          '''

          GROOVY_BLOCK = '''
          // --- Ditambahkan otomatis oleh CI: paksa compileSdk seragam ke semua modul ---
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          '''

          MARKER = "Ditambahkan otomatis oleh CI"
          candidates = [
              ("android/build.gradle.kts", KTS_BLOCK),
              ("android/build.gradle", GROOVY_BLOCK),
          ]

          found = False
          for path, block in candidates:
              p = pathlib.Path(path)
              if not p.exists():
                  continue
              found = True
              text = p.read_text()
              if MARKER in text:
                  print(f"{path}: override sudah ada, dilewati.")
                  continue
              text = text.rstrip() + "\n" + block
              p.write_text(text)
              print(f"{path}: override compileSdk (root, subprojects) berhasil ditambahkan.")
              print("--- Isi file lengkap setelah patch: ---")
              print(text)

          if not found:
              print("PERINGATAN: tidak ditemukan android/build.gradle(.kts) di root!")
          PYEOF

      - name: Ambil dependency
        run: flutter pub get

      - name: Generate Hive TypeAdapter (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Enkripsi data_koordinat.json -> .enc
        run: python3 encrypt_data.py

      - name: Build APK (release)
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: pencari-kecamatan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
